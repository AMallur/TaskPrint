name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/taskprint
      - run: pytest --cov=taskprint --cov-report=term --cov-fail-under=85
      - run: python -m build
      - run: twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: taskprint --help

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pip-audit --cache-dir .pip-audit-cache
      - run: bandit -c pyproject.toml -r src/taskprint
